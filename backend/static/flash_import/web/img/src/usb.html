<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>
body{width:720px;height:405px;background:#eceff1;display:flex;gap:22px;padding:22px;align-items:flex-start}
.panel{background:#fff;border-radius:14px;box-shadow:0 2px 6px rgba(0,0,0,.15);overflow:hidden;flex:1}
.notif{padding:16px 18px}
.notif .app{font-size:12px;color:#5f6368;margin-bottom:6px}
.notif .k{font-size:16px;font-weight:500}
.notif .v{font-size:14px;color:#5f6368;margin-top:4px}
.arrow{align-self:center;font-size:40px;color:#f57c00}
.h{font-size:13px;color:#00897b;font-weight:500;padding:14px 20px 6px}
.radio{display:flex;align-items:center;gap:18px;padding:11px 20px;font-size:16px}
.radio i{width:20px;height:20px;border-radius:50%;border:2px solid #5f6368;flex:none}
.radio.on{background:#e0f2f1;outline:3px solid #f57c00;outline-offset:-3px}
.radio.on i{border-color:#00897b;box-shadow:inset 0 0 0 4px #fff;background:#00897b}
</style></head><body>
<div class="panel" style="flex:.9;align-self:center">
 <div class="notif hl" style="padding-left:18px"><div class="app">⚙ Android System</div><div class="k">Charging this device via USB</div><div class="v">Tap for more options.</div></div>
</div>
<div class="arrow">➜</div>
<div class="panel">
 <div class="bar" style="height:52px"><span class="b">←</span><span class="t" style="font-size:19px">USB Preferences</span></div>
 <div class="h">Use USB for</div>
 <div class="radio on"><i></i>File transfer / Android Auto</div>
 <div class="radio"><i></i>USB tethering</div>
 <div class="radio"><i></i>MIDI</div>
 <div class="radio"><i></i>PTP</div>
 <div class="radio"><i></i>No data transfer</div>
</div>
</body></html>
