<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Securite — maquette InvadersHunter</title>
<!-- Source : frontend/src/app/settings/security.tsx -->
<link rel="stylesheet" href="../../shared/fonts.css">
<link rel="stylesheet" href="../../shared/app.css">
<style>
  /* SettingsShell : contenu centré verticalement sous le titre, qui défile s'il dépasse */
  .shell-body { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; justify-content: safe center; }
  .shell-body::-webkit-scrollbar { display: none; }
  .shell-body > * { flex-shrink: 0; }
  .placeholder-block { background: var(--bg-element); border: 1px solid var(--border); border-radius: var(--r-md);
    padding: var(--sp-4); display: flex; flex-direction: column; align-items: center; gap: var(--sp-2); }
  .placeholder-text { color: var(--text); font-size: var(--fs-md); }
  .placeholder-body { color: var(--text-muted); font-size: var(--fs-xs); line-height: 20px; text-align: center; }
</style>
</head>
<body>
  <header class="page-bar">
    <h1><a href="../../index.html">Maquettes</a> / Securite <small>Réglages › Sécurité</small></h1>
    <div class="theme-switch"></div>
  </header>

  <div class="phone">
    <div class="sb">12:47</div>
    <div class="screen">
      <!-- En-tête commun des sous-pages (SettingsShell) -->
      <div class="shell-header">
        <div class="back">&lt; Retour</div>
        <div class="shell-title">Securite</div>
      </div>

      <div class="shell-body">
        <!-- Bloc « bientôt disponible » -->
        <div class="placeholder-block">
          <div class="placeholder-text">Bientot disponible</div>
          <div class="placeholder-body">Cette section sera disponible dans une prochaine mise a jour.</div>
        </div>
      </div>
    </div>
  </div>

  <p class="page-notes">Écran provisoire : la gestion email / mot de passe n'existe pas encore.</p>

  <script src="https://unpkg.com/lucide@0.344.0/dist/umd/lucide.min.js"></script>
  <script src="../../shared/app.js"></script>
</body>
</html>
